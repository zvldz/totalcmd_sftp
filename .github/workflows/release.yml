name: Release

# Tag naming convention:
#   v10.0.2.0-beta1 → prerelease
#   v10.0.2.0-rc1   → prerelease
#   v10.0.2.0       → stable release, marked latest
#
# Push a matching tag to trigger a fresh build + GitHub Release. The bin/
# folder is intentionally NOT committed once this workflow is in use — the
# canonical download lives on the release page.

on:
  push:
    tags:
      - 'v*'

permissions:
  # Required to create a GitHub Release and attach the built ZIP.
  contents: write

jobs:
  build:
    # A named image: the toolchain changes when the workflow says so, not when
    # GitHub moves windows-latest.
    runs-on: windows-2025

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # openssl and libssh2 sources live as submodules and are
          # rebuilt from source on every run. Only these two: OpenSSL's own
          # submodules are test suites and external projects the build
          # does not use.
          submodules: true
          # Full history so `git describe` and CHANGELOG lookup work.
          fetch-depth: 0
          # The token is not left in .git/config for the build steps; only
          # the publishing step uses it, through its own input.
          persist-credentials: false

      - name: Compute build metadata
        id: meta
        shell: pwsh
        # The tag reaches the script as data (env), never as script text: a
        # tag name with a `$(...)` in it would otherwise run.
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          $tag = $env:TAG
          $sha = $env:SHA.Substring(0, 7)
          $date = (Get-Date -Format "yyyy-MM-dd").ToString()
          # Anything carrying a pre-release suffix stays off the "latest"
          # download; only a bare version tag is published as stable.
          $isPre = if ($tag -match '-(beta|rc)\d*$') { "true" } else { "false" }

          # BuildInfo.h picks this file up via __has_include; no /D flag
          # required. Everything the plugin surfaces about itself (startup
          # log, F7 help trailer) is derived from these three defines.
          $header = @"
          #pragma once
          #define SFTP_BUILD_TAG  "$tag"
          #define SFTP_BUILD_SHA  "$sha"
          #define SFTP_BUILD_DATE "$date"
          "@
          $header | Out-File -Encoding utf8 -NoNewline `
            -FilePath src\include\build_info_gen.h

          "tag=$tag"              >> $env:GITHUB_OUTPUT
          "sha=$sha"              >> $env:GITHUB_OUTPUT
          "date=$date"            >> $env:GITHUB_OUTPUT
          "prerelease=$isPre"     >> $env:GITHUB_OUTPUT
          Write-Host "Build metadata: tag=$tag sha=$sha date=$date prerelease=$isPre"

      - name: Check tag against the sources
        shell: pwsh
        # The tag names the version the plugin reports, and a stable release
        # never ships with the debug log on (it writes every operation to
        # %TEMP%\sftpplug.log). Pre-releases keep the log for testing.
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          $version = $env:TAG.TrimStart('v') -replace '-(beta|rc)\d*$', ''
          $header = Get-Content -Raw src\include\version.h
          if ($header -notmatch '#define VER_FILEVERSION_STR\s+"([^"]+)"') {
            throw "version.h: VER_FILEVERSION_STR not found"
          }
          if ($Matches[1] -ne $version) {
            throw "Tag $version does not match version.h $($Matches[1])"
          }
          if ($env:PRERELEASE -ne "true") {
            $global = Get-Content -Raw src\include\global.h
            if ($global -notmatch '(?m)^#define LOG_ENABLED\s+0\b') {
              throw "Stable tag with LOG_ENABLED on in global.h"
            }
          }
          Write-Host "Tag matches version.h $version"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce  # v2.0.0

      - name: Install NASM
        # OpenSSL 3.x requires NASM for both x64 and x86 assembly. Not
        # pre-installed on the runner. Chocolatey drops nasm.exe into
        # C:\Program Files\NASM\, which matches build-deps.ps1's search
        # path — no PATH tweaking needed. A fixed version: its output goes
        # straight into libcrypto's crypto code.
        shell: pwsh
        run: choco install nasm --version=2.16.3 -y --no-progress

      - name: Build dependencies (OpenSSL, libssh2) — FULL from source
        shell: pwsh
        # Every release build compiles the third-party stack from scratch,
        # deliberately NOT using any cache. Locally we skip this step
        # between runs because the outputs sit in thirdparty/build/, but on
        # the runner we want a clean-room rebuild for reproducibility — no
        # stale artefact from a prior run, no accidental drift when a
        # submodule commit changes. Cost: ~15-25 minutes on windows-latest
        # (OpenSSL is the bulk), acceptable since releases are rare.
        run: ./build-deps.ps1 -Clean

      - name: Unit tests (x64 + x86)
        shell: pwsh
        # Built against the OpenSSL just produced; a failing test stops the
        # release before the plugin is built.
        run: ./tests/run-unit-tests.ps1

      - name: Language files and shortcuts
        shell: pwsh
        # Every string translated with the same placeholders, and no dialog
        # with two controls on one shortcut letter, in any language.
        run: |
          ./tests/check-languages.ps1
          if ($LASTEXITCODE -ne 0) { throw "Language check failed" }
          ./tests/check-mnemonics.ps1
          if ($LASTEXITCODE -ne 0) { throw "Shortcut check failed" }

      - name: Stable configuration (log off) builds and passes
        shell: pwsh
        # Every tag builds the configuration a stable release ships, with the
        # debug log off, and runs the unit tests in it, so the first stable
        # tag is not the first time it is compiled. cl reads CL from the
        # environment; the release build below is a full rebuild without it.
        env:
          CL: /DLOG_ENABLED=0
        run: |
          ./build.ps1 -x64only -classiconly -nodeploy -nohelp
          if ($LASTEXITCODE -ne 0) { throw "Build with LOG_ENABLED=0 failed" }
          ./tests/run-unit-tests.ps1 -Arch x64

      - name: Build plugin (classic + extra, Release x64 + x86)
        shell: pwsh
        # The help page is generated from src/help by a Python script, so the
        # runner builds it like everything else — nothing is carried in the
        # repository and nothing can go stale between an edit and a tag.
        run: ./build.ps1

      - name: Package check
        shell: pwsh
        # What each package holds, and how its plugin files are built:
        # architecture, ASLR/DEP/CFG, exports, system DLLs only.
        run: |
          ./tests/check-package.ps1
          if ($LASTEXITCODE -ne 0) { throw "Package check failed" }

      - name: Rename release artifacts
        id: zip
        shell: pwsh
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          $tag = $env:TAG
          # Two builds: classic (SSH only) and extra (+ PHP Agent, LAN Pair).
          $paths = @()
          # The symbols archive resolves crash-report addresses of this build.
          foreach ($pair in @(@("bin\SFTPplug.zip", "bin\SFTPplug-$tag.zip"),
                              @("bin\SFTPplug-extra.zip", "bin\SFTPplug-$tag-extra.zip"),
                              @("bin\SFTPplug-pdb.zip", "bin\SFTPplug-$tag-pdb.zip"))) {
            if (-not (Test-Path $pair[0])) {
              throw "Build did not produce $($pair[0])"
            }
            Copy-Item $pair[0] $pair[1]
            $paths += $pair[1]
          }
          # Checksums of the published files, in the format `sha256sum -c`
          # reads, so a download can be checked against the release page.
          $sums = foreach ($p in $paths) {
            "$((Get-FileHash -Algorithm SHA256 $p).Hash.ToLowerInvariant())  $(Split-Path -Leaf $p)"
          }
          $sums -join "`n" | Out-File -Encoding ascii -NoNewline bin\SHA256SUMS
          $paths += "bin\SHA256SUMS"
          # Newline-separated, as the release step takes a file list.
          "paths<<EOF" >> $env:GITHUB_OUTPUT
          $paths -join "`n" >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Extract CHANGELOG section for release notes
        id: notes
        shell: pwsh
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          $tag = $env:TAG
          # Tags carry the `v` prefix; CHANGELOG headings do not.
          $version = $tag.TrimStart('v')

          $content = Get-Content -Raw CHANGELOG.md

          # Prefer an exact-match section (`## 10.0.2.0-rc1 - date`).
          $pattern = "(?ms)^## \s*$([regex]::Escape($version))\b.*?(?=^## |\z)"
          $match = [regex]::Match($content, $pattern)

          # Fall back to the base version section when no section exists for
          # this specific pre-release — the CHANGELOG accumulates detail
          # under the plain `## 10.0.2.0` heading until the stable release.
          if (-not $match.Success) {
            $stripped = $version -replace '-(beta|rc)\d*$', ''
            $pattern = "(?ms)^## \s*$([regex]::Escape($stripped))\b.*?(?=^## |\z)"
            $match = [regex]::Match($content, $pattern)
          }

          $body = if ($match.Success) { $match.Value.Trim() } else { "Release $tag" }
          $body | Out-File -Encoding utf8 release-notes.md
          "path=release-notes.md" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          files: ${{ steps.zip.outputs.paths }}
          body_path: ${{ steps.notes.outputs.path }}
